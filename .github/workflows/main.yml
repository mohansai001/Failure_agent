name: Failure-Agent CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  AZURE_WEBAPP_NAME: "Failureagent"

jobs:

  # ============================================================
  # BUILD
  # ============================================================
  build:
    name: Build Python App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ----------------------------------------------------------
      # Install dependencies directly into the deployment package.
      #
      # Azure App Setting:
      # SCM_DO_BUILD_DURING_DEPLOYMENT=false
      #
      # Therefore dependencies are installed during CI rather
      # than being rebuilt by Azure during deployment/startup.
      # ----------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            --target=".python_packages/lib/site-packages" \
            -r requirements.txt

      # ----------------------------------------------------------
      # Check dependency package size
      # ----------------------------------------------------------
      - name: Check Dependency Size
        run: |
          echo "========================================"
          echo "Python dependency package size"
          echo "========================================"

          du -sh .python_packages

          echo ""
          echo "Largest installed packages:"
          du -sh .python_packages/lib/site-packages/* 2>/dev/null \
            | sort -hr \
            | head -30

      # ----------------------------------------------------------
      # Check whether Oryx-generated files already exist
      # ----------------------------------------------------------
      - name: Check for Oryx Files
        run: |
          echo "========================================"
          echo "Checking workspace for Oryx files"
          echo "========================================"

          find . -maxdepth 3 \
            \( \
              -name "oryx-manifest.toml" -o \
              -name "oryx-manifest.json" -o \
              -name "output.tar.zst" -o \
              -name "antenv" \
            \) \
            -print || true

      # ----------------------------------------------------------
      # Create deployment package
      # ----------------------------------------------------------
      - name: Create Deployment Package
        run: |
          rm -f app.zip

          zip -r app.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "venv/*" \
            -x ".venv/*" \
            -x "antenv/*" \
            -x ".pytest_cache/*" \
            -x ".mypy_cache/*" \
            -x ".ruff_cache/*" \
            -x "oryx-manifest.toml" \
            -x "oryx-manifest.json" \
            -x "output.tar.zst"

      # ----------------------------------------------------------
      # Verify deployment package
      # ----------------------------------------------------------
      - name: Verify Deployment Package
        run: |
          echo "========================================"
          echo "Deployment package"
          echo "========================================"

          ls -lh app.zip

          echo ""
          echo "Package size:"
          du -h app.zip

          echo ""
          echo "First 100 files:"
          unzip -l app.zip | head -100

          echo ""
          echo "========================================"
          echo "Checking Python dependencies"
          echo "========================================"

          unzip -l app.zip \
            | grep ".python_packages/lib/site-packages" \
            | head -10 || true

          echo ""
          echo "========================================"
          echo "Checking for Oryx-generated files"
          echo "========================================"

          if unzip -l app.zip \
            | grep -E "oryx-manifest|output\.tar\.zst|antenv"; then
            echo "WARNING: Oryx-related files found in deployment package."
          else
            echo "OK: No Oryx-generated files found in deployment package."
          fi

      # ----------------------------------------------------------
      # Upload deployment artifact
      # ----------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip


  # ============================================================
  # SAST
  # ============================================================
  sast:
    name: Security Scan (SAST)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/path" \
            zricethezav/gitleaks:latest detect \
            --source="/path" \
            --verbose \
            --redact

      - name: Run Trivy FS Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1


  # ============================================================
  # DEPLOY
  # ============================================================
  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      # ----------------------------------------------------------
      # Verify downloaded artifact
      # ----------------------------------------------------------
      - name: Verify Downloaded Artifact
        run: |
          echo "========================================"
          echo "Downloaded artifact"
          echo "========================================"

          ls -lh

          echo ""
          echo "app.zip:"
          ls -lh app.zip

          echo ""
          echo "Checking package for Oryx files:"

          unzip -l app.zip \
            | grep -E "oryx-manifest|output\.tar\.zst|antenv" \
            || echo "OK: No Oryx-generated files found."

      # ----------------------------------------------------------
      # Deploy
      # ----------------------------------------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip
